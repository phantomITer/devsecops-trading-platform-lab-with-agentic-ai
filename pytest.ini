[pytest]
testpaths = tests
pythonpath = .
addopts = -v --tb=short -p no:warnings
log_cli = true
log_cli_level = INFO

# 테스트 카테고리 마커 정의
markers =
    smoke: 스모크 테스트 - API 기본 동작 확인
    validation: 밸리데이션 테스트 - 입력값 검증 및 에러 처리
    integration: 인테그레이션 테스트 - API 간 연동 흐름
    security: 보안 테스트 - OWASP Top10 테스트
    e2e: E2E 테스트 - 전체 시나리오 테스트
