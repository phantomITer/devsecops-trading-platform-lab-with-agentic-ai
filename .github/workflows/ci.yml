# ============================================================
# DevSecOps Trading Platform Lab - GitHub Actions CI Pipeline
# Phase 4: DevSecOps - CI/CD with SAST + Pytest
# ============================================================
name: CI - DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────
  # Job 1: SAST - Static Application Security Testing
  # Tool: Bandit (Python security linter)
  # ──────────────────────────────────────────
  sast-bandit:
    name: SAST - Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r app/ \
            --severity-level medium \
            --confidence-level medium \
            -f txt \
            -o bandit-report.txt || true
          echo "===== Bandit Report ====="
          cat bandit-report.txt

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: bandit-report.txt
          retention-days: 30

  # ──────────────────────────────────────────
  # Job 2: Unit & Integration Tests
  # Tool: pytest (with all test categories)
  # ──────────────────────────────────────────
  test:
    name: Pytest - Full Test Suite
    runs-on: ubuntu-latest
    needs: sast-bandit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Tests
        run: |
          pytest tests/smoke/ -v --tb=short -p no:warnings \
            -m smoke || true

      - name: Run Validation Tests
        run: |
          pytest tests/validation/ -v --tb=short -p no:warnings \
            -m validation || true

      - name: Run Integration Tests
        run: |
          pytest tests/integration/ -v --tb=short -p no:warnings \
            -m integration || true

      - name: Run Security Tests
        run: |
          pytest tests/security/ -v --tb=short -p no:warnings \
            -m security || true

      - name: Run E2E Tests
        run: |
          pytest tests/e2e/ -v --tb=short -p no:warnings \
            -m e2e || true

      - name: Run Full Test Suite (All categories)
        run: |
          pytest tests/ -v --tb=short -p no:warnings \
            --ignore=tests/utils \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-test-results
          path: test-results.xml
          retention-days: 30

  # ──────────────────────────────────────────
  # Job 3: Dependency Vulnerability Scan
  # Tool: pip-audit (checks CVEs in dependencies)
  # ──────────────────────────────────────────
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip install -r requirements.txt
          pip-audit -r requirements.txt \
            --format=json \
            --output=pip-audit-report.json || true
          echo "===== pip-audit Report ====="
          cat pip-audit-report.json

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  # ──────────────────────────────────────────
  # Job 4: CI Summary
  # ──────────────────────────────────────────
  ci-summary:
    name: CI Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ sast-bandit, test, dependency-scan ]
    if: always()
    steps:
      - name: Print CI Summary
        run: |
          echo "============================================"
          echo " DevSecOps Trading Platform Lab - CI Done"
          echo "============================================"
          echo " SAST Bandit     : ${{ needs.sast-bandit.result }}"
          echo " Pytest Tests    : ${{ needs.test.result }}"
          echo " Dependency Scan : ${{ needs.dependency-scan.result }}"
          echo "============================================"
